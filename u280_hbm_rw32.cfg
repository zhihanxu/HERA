# Implementation directives for attempt 3. Attempt 1 failed in routing and
# attempt 2 reached routing with the placer still reporting "highly congested"
# and post-place congestion at level 5 (32x32 North), even after removing the
# FIFO dropped SLR0 BRAM from 45.8% to 10.0%. Capacity is not the constraint
# (35% LUT), so the fix has to be in how the tools place and route, not in how
# much logic there is.
#
#   AltSpreadLogic_high    spreads logic away from the congested region instead
#                          of packing it tightly around the 32 HBM ports.
#   AlternateCLBRouting    uses alternate routing algorithms for congestion;
#                          costs runtime, which is the right trade at 3 h.
#   PHYS_OPT_DESIGN        was never reached as a step in attempt 2; enabled
#                          explicitly so post-place optimization always runs.
#   POST_ROUTE_PHYS_OPT    insurance for the thin margin: post-place WNS was
#                          only +0.004 ns at 300 MHz, so routing can easily
#                          push it negative. Only runs if routing succeeds.
[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
