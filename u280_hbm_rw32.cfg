# v++ link configuration for the 32-channel hbm_rw test: one CU per HBM
# pseudo-channel, each with its own independent AXI master.
#
# All 32 HBM AXI ports live in SLR0, so every CU is pinned to SLR0: letting
# Vitis place CUs in SLR1/SLR2 would force 512-bit read+write data across the
# SLR boundary, and the M5.4 build already used 31% of the SLR1<->SLR0 crossing
# resources with a single CU.
[connectivity]
nk=hbm_rw:32
sp=hbm_rw_1.m00_axi:HBM[0]
sp=hbm_rw_2.m00_axi:HBM[1]
sp=hbm_rw_3.m00_axi:HBM[2]
sp=hbm_rw_4.m00_axi:HBM[3]
